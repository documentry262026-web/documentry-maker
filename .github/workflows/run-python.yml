name: Run Python Script

on:
  push:
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify MoviePy
        run: |
          python -c "from moviepy.editor import VideoFileClip, AudioFileClip, concatenate_videoclips; print('MoviePy installed successfully')"

      - name: Run main.py
        run: python main.py
